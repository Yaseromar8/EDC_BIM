# La suite oficial del ECD es `backend/tests`, y solo esa.
#
# POR QUE EXISTE ESTE FICHERO
# --------------------------
# En la raiz del repositorio hay ~28 ficheros llamados `test_*.py` que NO son
# pruebas: son GUIONES de diagnostico. Su cuerpo se ejecuta al importarse, y
# algunos cargan el `.env` real y escriben en la base de datos de verdad --
# `test_tracking.py` hace un INSERT en `photo_evidences` sobre el alcance real
# '1_CANAL'--. Basta con que pytest los RECOLECTE para que eso ocurra: no hace
# falta que la ejecucion llegue a terminar.
#
# `testpaths` hace que `pytest` a secas mire solo la suite oficial. El
# `conftest.py` de la raiz cierra la otra mitad: se niega a recolectar esos
# guiones aunque alguien los nombre expresamente.
[pytest]
testpaths = backend/tests
norecursedirs = .git node_modules venv venv2 dist build __pycache__ *.egg-info
