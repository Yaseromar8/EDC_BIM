services:
  - type: web
    name: visor-aps-backend
    env: python
    region: oregon
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && alembic upgrade head && gunicorn --bind 0.0.0.0:$PORT --workers 4 --threads 2 --timeout 300 server:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: MAPS_PREPARATION_SECONDS
        value: 5
      - key: LOB_REQUIRE_SOURCE_ARCHIVE
        value: true
      # Sin esta variable el backend cae a CORS '*' (server.py). Incluye los
      # origenes del APK Capacitor o la app de campo deja de hablar con el backend.
      - key: CORS_ORIGINS
        value: https://visor-ecd-frontend.onrender.com,https://visor-ecd-docs.onrender.com,https://visor-ecd-portal.onrender.com,capacitor://localhost,https://localhost,http://localhost:5173
      # Clave para firmar enlaces de invitacion / reset / verificacion.
      # Render la genera una vez y la mantiene estable entre despliegues.
      - key: APP_SECRET
        generateValue: true
