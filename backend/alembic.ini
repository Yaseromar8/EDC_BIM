# Configuración de Alembic (migraciones de esquema).
# La URL de la BD NO va aquí (tiene secretos): se construye en alembic/env.py
# desde las mismas variables de entorno que usa la app (DB_USER/DB_PASS/DB_HOST/...).

[alembic]
script_location = alembic
prepend_sys_path = .
# Formato de nombre de archivo de revisión: 0001_descripcion, 0002_..., legible y ordenado.
# (Usamos ids manuales en el revision=, esto es solo para autogenerados.)

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
