# La suite se ejecuta SOLO sobre tests/.
#
# En la raiz de backend/ conviven cinco guiones sueltos que se llaman test_*.py
# -- test_api, test_base64, test_engines, test_filter, test_regex -- y que no
# son pruebas: son sondas manuales que hacen peticiones HTTP a localhost:3000
# al IMPORTARSE. Con el servidor levantado se colaban en la suite; con el
# servidor parado la reventaban entera en la fase de recoleccion, antes de
# ejecutar una sola prueba de verdad.
#
# Una suite cuyo resultado depende de si hay un servidor encendido no dice nada
# de si el codigo esta bien. Acotar el ambito lo hace determinista, y de paso
# impide que una sonda con nombre de prueba vuelva a decidir si el arbol esta
# verde.
[pytest]
testpaths = tests
